name: eatwise
description: Smart calorie & macro tracker.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # AI Vision
  google_generative_ai: ^0.4.3

  # Charts
  fl_chart: ^1.2.0

  # Image picking
  image_picker: ^1.1.2

  # Routing
  go_router: ^14.2.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  sqflite: ^2.4.3
  path: ^1.9.1
  http: ^1.2.2
  flutter_dotenv: ^6.0.1
  google_fonts: ^6.2.1
  connectivity_plus: ^6.0.0
  shimmer: ^3.0.0
  flutter_secure_storage: ^11.0.0
  mobile_scanner: ^7.4.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  image_path: "app-icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
